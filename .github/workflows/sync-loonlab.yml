# GitHub Actions：每天定时自动搬库，上游 LoonLab -> OCI 桶
# 放到仓库的 .github/workflows/sync-loonlab.yml，密钥全部走 GitHub Secrets：
#   OCI_S3_ACCESS_KEY / OCI_S3_SECRET_KEY（OCI 控制台建的 Customer Secret Key，能写桶）
# 本文件不含任何密钥值。
name: Sync LoonLab to OCI
on:
  schedule:
    - cron: "0 19 * * *"  # 每天 03:00 北京时间（UTC 19:00）
  workflow_dispatch:  # 手动点一下也能立刻跑一次
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3
      - run: python3 sync-loonlab.py
        env:
          OCI_S3_ACCESS_KEY: ${{ secrets.OCI_S3_ACCESS_KEY }}
          OCI_S3_SECRET_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
      - run: python3 make-loonlab-index.py
        env:
         OCI_S3_ACCESS_KEY: ${{ secrets.OCI_S3_ACCESS_KEY }}
         OCI_S3_SECRET_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
